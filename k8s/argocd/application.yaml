apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: YOUR_GITHUB_REPOSITORY_URL
    targetRevision: main
    path: k8s
    directory:
      recurse: true
      include: '{namespace.yaml,deployment.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
